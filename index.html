<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->


  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="final_tv_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>final_tv_app</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = "3388794577";
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #16213a;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #scale-wrapper {
      width: 1097px;
      height: 617px;
      flex-shrink: 0;
      transform-origin: center center;
      background: #16213a;
    }
    #scale-wrapper > flutter-view,
    #scale-wrapper > flt-glass-pane,
    #scale-wrapper > flt-scene-host,
    #scale-wrapper > canvas,
    #scale-wrapper > * {
      width: 1097px !important;
      height: 617px !important;
    }
  </style>
</head>
<body>
  <div id="scale-wrapper"></div>
  <script>
    (function () {
      var BASE_W = 1097;
      var BASE_H = 617;
      var wrapper = document.getElementById('scale-wrapper');

      function fit() {
        var scale = Math.min(window.innerWidth / BASE_W, window.innerHeight / BASE_H);
        wrapper.style.transform = 'scale(' + scale + ')';
      }

      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      document.addEventListener('fullscreenchange', function () {
        // viewport size change is async after fullscreenchange; refit next frame
        requestAnimationFrame(fit);
      });
      fit();
    })();

    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        }
      }).then(function(engineInitializer) {
        return engineInitializer.initializeEngine({
          hostElement: document.getElementById('scale-wrapper'),
        });
      }).then(function(appRunner) {
        return appRunner.runApp();
      });
    });
  </script>
</body>
</html>
